<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INFINICANVAS</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f0ecdf;color:#292820;font:12px ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.top{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.logo{font:900 clamp(28px,5vw,55px)/.85 sans-serif;letter-spacing:-.07em}.logo i{color:#ef5b35;font-style:normal}.sub,.coords{color:#77756c;margin-top:8px}.coords{text-align:right}.tools{position:fixed;left:18px;bottom:18px;background:#faf7eddf;border:1px solid #aaa497;border-radius:12px;padding:11px;display:flex;gap:7px;backdrop-filter:blur(10px)}button{border:1px solid #8f8a80;background:transparent;padding:9px 11px;font:inherit;cursor:pointer;border-radius:7px}button.on{background:#292820;color:#fff}.legend{position:fixed;right:18px;bottom:18px;text-align:right;color:#6f6b61;background:#faf7edbb;padding:10px;border-radius:8px}.legend b{color:#292820}.zoom{color:#ef5b35}@media(max-width:600px){.legend{display:none}.tools{right:18px;overflow:auto}.coords{display:none}}</style></head><body><canvas id="c"></canvas><div class="top"><div><div class="logo">INFINI<i>CANVAS</i></div><div class="sub">marks become rules · habitats · collaborators</div></div><div class="coords" id="coords"></div></div><div class="tools"><button class="on" data-tool="seed">SEED</button><button data-tool="river">RIVER</button><button data-tool="wall">WALL</button><button data-tool="erase">ERASE</button><button id="clear">CLEAR</button></div><div class="legend"><b>DRAW</b> pointer · <b>PAN</b> shift+drag · <b>ZOOM</b> wheel<br><span class="zoom" id="z">100%</span> · the habitat keeps evolving</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let dpr=devicePixelRatio||1,cam={x:0,y:0,z:1},tool='seed',drag=false,last,marks=[],agents=[];function resize(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0)}onresize=resize;resize();function addDemo(){for(let i=0;i<36;i++){let a=i/36*6.28,r=70+i*2.2;marks.push({x:innerWidth/2+Math.cos(a)*r,y:innerHeight/2+Math.sin(a)*r,type:i%7?'seed':'river',life:1})}for(let i=0;i<28;i++)agents.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2+(Math.random()-.5)*180,vx:0,vy:0,h:Math.random()*360})}addDemo();const world=(sx,sy)=>({x:(sx-cam.x)/cam.z,y:(sy-cam.y)/cam.z});c.onpointerdown=e=>{drag=true;last={x:e.clientX,y:e.clientY};if(!e.shiftKey)stamp(e)};c.onpointermove=e=>{document.querySelector('#coords').textContent=`X ${Math.round((e.clientX-cam.x)/cam.z)} / Y ${Math.round((e.clientY-cam.y)/cam.z)}`;if(!drag)return;if(e.shiftKey){cam.x+=e.clientX-last.x;cam.y+=e.clientY-last.y}else stamp(e);last={x:e.clientX,y:e.clientY}};onpointerup=()=>drag=false;function stamp(e){let p=world(e.clientX,e.clientY);if(tool==='erase'){marks=marks.filter(m=>Math.hypot(m.x-p.x,m.y-p.y)>30/cam.z);return}marks.push({x:p.x,y:p.y,type:tool,life:1});if(tool==='seed'&&Math.random()>.6)agents.push({x:p.x,y:p.y,vx:0,vy:0,h:Math.random()*360})}c.onwheel=e=>{e.preventDefault();let old=cam.z,n=Math.max(.3,Math.min(3,old*Math.exp(-e.deltaY*.001)));cam.x=e.clientX-(e.clientX-cam.x)*n/old;cam.y=e.clientY-(e.clientY-cam.y)*n/old;cam.z=n;document.querySelector('#z').textContent=Math.round(n*100)+'%'},{passive:false};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>q.classList.toggle('on',q===b))});document.querySelector('#clear').onclick=()=>{marks=[];agents=[]};function draw(t){x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#f0ecdf';x.fillRect(0,0,innerWidth,innerHeight);x.save();x.translate(cam.x,cam.y);x.scale(cam.z,cam.z);let step=34;x.strokeStyle='#d8d1c2';x.lineWidth=1/cam.z;for(let gx=(-cam.x/cam.z)%step;gx<innerWidth/cam.z;gx+=step){x.beginPath();x.moveTo(gx,-cam.y/cam.z);x.lineTo(gx,(innerHeight-cam.y)/cam.z);x.stroke()}for(let gy=(-cam.y/cam.z)%step;gy<innerHeight/cam.z;gy+=step){x.beginPath();x.moveTo(-cam.x/cam.z,gy);x.lineTo((innerWidth-cam.x)/cam.z,gy);x.stroke()}marks.forEach((m,i)=>{if(m.type==='seed'){let pulse=7+Math.sin(t*.002+i)*3;x.fillStyle='#ef5b3588';x.beginPath();x.arc(m.x,m.y,pulse,0,7);x.fill();x.strokeStyle='#2b846d';for(let k=0;k<3;k++){let a=k*2.1+i;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+Math.cos(a)*18,m.y+Math.sin(a)*18);x.stroke()}}else if(m.type==='river'){x.fillStyle='#3188aa66';x.beginPath();x.arc(m.x,m.y,14,0,7);x.fill()}else{x.fillStyle='#34342c';x.fillRect(m.x-3,m.y-15,6,30)}});agents.forEach((a,i)=>{let nearest=null,dd=1e9;marks.forEach(m=>{if(m.type==='seed'){let d=(m.x-a.x)**2+(m.y-a.y)**2;if(d<dd){dd=d;nearest=m}}});if(nearest){let ang=Math.atan2(nearest.y-a.y,nearest.x-a.x)+Math.sin(t*.001+i)*.8;a.vx=a.vx*.94+Math.cos(ang)*.035;a.vy=a.vy*.94+Math.sin(ang)*.035}a.x+=a.vx;a.y+=a.vy;x.fillStyle=`hsl(${160+a.h*.08} 45% 35%)`;x.beginPath();x.arc(a.x,a.y,3,0,7);x.fill();x.strokeStyle='#2b846d33';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(a.x-a.vx*25,a.y-a.vy*25);x.stroke()});x.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
